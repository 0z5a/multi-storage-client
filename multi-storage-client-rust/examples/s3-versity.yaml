profiles:
  emulator:
    storage_provider:
      type: s3
      options:
        base_path: ${MSC_S3_TEST_BUCKET}/examples
        endpoint_url: ${MSC_S3_TEST_ENDPOINT}
        region_name: us-east-1
        path_style: true
    credentials_provider:
      type: S3Credentials
      options:
        access_key: ${MSC_S3_TEST_ACCESS_KEY}
        secret_key: ${MSC_S3_TEST_SECRET_KEY}
